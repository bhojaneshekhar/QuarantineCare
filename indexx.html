<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuarantineCare – Smart Patient Monitoring</title>
<style>
:root{--b:#1a56db;--bd:#0f3a9e;--bl:#eaf1ff;--t:#0f1f3d;--g:#5f6f87;--ln:#d6e0f2;--r:#d92d20;--a:#b54708;--ok:#067647}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;color:var(--t);background:#f6f9ff}
button,input,select,textarea{font:inherit}h1,h2,h3{margin:0 0 8px}h2{font-size:20px}h3{font-size:15px}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{background:var(--bd)}
.btn.o{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.s{padding:4px 10px;font-size:12px}.btn.d{background:var(--r)}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;margin-top:3px}
label{display:block;font-weight:600;font-size:12px;color:var(--g);margin-top:10px}
#app{display:flex;min-height:100vh}aside{width:220px;background:var(--bd);color:#fff;padding:14px;flex:none}
aside a{display:block;padding:9px 10px;border-radius:8px;color:#dbe6ff;cursor:pointer;margin-bottom:2px}aside a.on,aside a:hover{background:#fff;color:var(--bd);font-weight:600}
aside small{display:block;margin:14px 8px 4px;color:#9db8ff}main{flex:1;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--ln);border-left:4px solid var(--b);border-radius:12px;padding:12px}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--g);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:320px 1fr;gap:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);font-size:13px}th{color:var(--g);font-size:12px;background:var(--bl)}
.bg{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bl);color:var(--bd)}
.bg.w{background:#fff3e0;color:var(--a)}.bg.r{background:#fee4e2;color:var(--r)}.bg.k{background:#dcfae6;color:var(--ok)}
.al{padding:10px 12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bl);border:1px solid var(--ln)}
.al.warn{background:#fff7e6;border-color:#f5d28a}.al.danger{background:#fee4e2;border-color:#f6b4ae}
.bar{height:10px;background:var(--bl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border:1px solid var(--ln);border-radius:9px;margin-bottom:6px;cursor:pointer;background:#fff}.it.on{border-color:var(--b);background:var(--bl)}
.sc{max-height:520px;overflow:auto}.ch{width:100%;height:auto}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.rm{border:1px solid var(--b);background:var(--bl);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;cursor:pointer}
.rm.f{background:#fff;border-style:dashed;color:var(--g)}.rm.x{background:#fee4e2;border-color:var(--r)}.rm.e{background:#dcfae6;border-color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(15,31,61,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:#fff;border-radius:14px;padding:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;gap:6px}.tt{background:var(--bd);color:#fff;padding:10px 14px;border-radius:10px;max-width:360px}.tt.err{background:var(--r)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:linear-gradient(160deg,var(--bd),var(--b));color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:center}
.lf{display:flex;align-items:center;justify-content:center;padding:24px}.lf .card{width:100%;max-width:400px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--b);color:var(--b);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12px}
.pips{display:inline-flex;gap:3px}.pips i{width:12px;height:12px;border-radius:50%;background:var(--ln)}.pips i.on{background:var(--b)}
@media(max-width:800px){#app{flex-direction:column}aside{width:auto;display:flex;flex-wrap:wrap;gap:4px}aside small{display:none}.g2,.g3,.login{grid-template-columns:1fr}.hero{display:none}}

.hero2{background:linear-gradient(120deg,#0f3a9e,#1a56db 60%,#4c8bff);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative}
.hero2 h2{font-size:24px;margin:0}.hero2 .btn{background:#fff;color:var(--bd)}.hero2 input{width:300px;max-width:100%;border:0}
#gr{position:absolute;right:20px;top:70px;background:#fff;color:var(--t);border-radius:10px;box-shadow:0 8px 24px rgba(15,58,158,.25);width:300px;z-index:5;display:none}#gr div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--ln)}#gr div:hover{background:var(--bl)}
.kp6{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.kpi2{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(26,86,219,.06)}.kpi2>div:nth-child(2){flex:1}.kpi2 b{font-size:24px;display:block;line-height:1.1}.kpi2 span{color:var(--g);font-size:12px;display:block}
.ic{width:42px;height:42px;border-radius:12px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.hb{margin:8px 0}.hb div.bar{height:12px;margin-top:3px}
.tabs{display:flex;background:var(--bl);border-radius:10px;padding:4px;margin-bottom:12px}.tabs a{flex:1;text-align:center;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--g)}.tabs a.on{background:#fff;color:var(--b);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pw{position:relative}.eye{position:absolute;right:10px;top:12px;font-size:12px;color:var(--b);cursor:pointer;font-weight:600}.pm{height:6px;background:var(--bl);border-radius:6px;margin-top:6px;overflow:hidden}.pm i{display:block;height:100%;transition:.2s}
.lc{box-shadow:0 12px 40px rgba(15,58,158,.15);border-radius:18px;padding:26px}.lk{color:var(--b);cursor:pointer;font-weight:600;font-size:12px}
.feat{display:flex;gap:10px;align-items:center;margin:8px 0}.feat span{background:rgba(255,255,255,.18);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.stt{display:flex;gap:22px;margin-top:20px}.stt b{font-size:24px;display:block}.stt small{color:#cfe0ff}

.btn{box-shadow:0 3px 0 #0b2a75;transition:transform .1s,box-shadow .1s}.btn.o{box-shadow:0 3px 0 #b9ccf5}.btn.d{box-shadow:0 3px 0 #8f1d14}.hero2 .btn{box-shadow:0 3px 0 #b9ccf5}.btn:active{transform:translateY(3px);box-shadow:none}
.kp6,.g2,.g3,.kpis{perspective:1400px}.card,.kpi2,.kpi{transition:transform .25s,box-shadow .25s;box-shadow:0 1px 0 #fff inset,0 6px 14px rgba(15,58,158,.08),0 1px 0 #cfe0ff}
.kpi2:hover,.card:hover:not(.lc){transform:translateY(-4px) rotateX(3deg);box-shadow:0 18px 30px rgba(15,58,158,.18),0 2px 0 #b9ccf5}
aside{box-shadow:6px 0 18px rgba(15,58,158,.25)}aside a.on{box-shadow:0 3px 0 #9db8ff}
.scn{perspective:1400px;height:560px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fff,#e3ecff);border-radius:16px;border:1px solid var(--ln);overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.stg{position:relative;width:0;height:0;transform-style:preserve-3d}
.slab{position:absolute;background:rgba(26,86,219,.1);border:2px solid rgba(26,86,219,.4);border-radius:10px;transform:translateZ(-1px)}.slab span{position:absolute;left:10px;bottom:4px;font-weight:700;color:var(--bd);font-size:13px}
.bx{position:absolute;width:34px;height:34px;transform-style:preserve-3d;cursor:pointer}.bx i{position:absolute;background:var(--c);border:1px solid rgba(255,255,255,.4)}
.bx .t{left:0;top:0;width:34px;height:34px;transform:translateZ(var(--h));filter:brightness(1.15);font:700 10px/32px system-ui;color:#fff;text-align:center}
.bx .f,.bx .b{left:0;width:34px;height:var(--h);transform-origin:0 0;transform:rotateX(90deg)}.bx .f{top:34px;filter:brightness(.9)}.bx .b{top:0;filter:brightness(.85)}
.bx .r,.bx .l{top:0;width:var(--h);height:34px;transform-origin:0 0;transform:rotateY(-90deg)}.bx .r{left:34px;filter:brightness(.75)}.bx .l{left:0;filter:brightness(.8)}.bx:hover{filter:brightness(1.15)}
.cw{perspective:700px;height:150px;display:flex;justify-content:center;align-items:center;margin:14px 0 4px}.cube{width:84px;height:84px;position:relative;transform-style:preserve-3d;animation:spin 10s linear infinite}
.cube i{position:absolute;width:84px;height:84px;background:rgba(255,255,255,.92);border:2px solid #1a56db;display:flex;align-items:center;justify-content:center;font:700 38px system-ui;color:#d92d20}
.cube i:nth-child(1){transform:translateZ(42px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(42px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(42px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(42px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(42px);background:#cfe0ff}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(42px);background:#cfe0ff}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}@media(prefers-reduced-motion:reduce){.cube{animation:none}.card,.kpi2{transition:none}}

:root{--ln:#e1e9f7;--sh:0 1px 2px rgba(15,58,158,.06),0 8px 24px rgba(15,58,158,.08)}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:#f2f6fd;-webkit-font-smoothing:antialiased}

aside a:hover{background:rgba(255,255,255,.14);color:#fff}aside a.on{background:#fff;color:var(--bd);box-shadow:0 4px 12px rgba(0,0,0,.2)}aside small{margin:16px 12px 6px;font-size:11px}

.bell{display:inline-flex;gap:6px;align-items:center;background:var(--bl);color:var(--bd);padding:7px 12px;border-radius:99px;font-weight:700;cursor:pointer}.bell.w{background:#fff3e0;color:var(--a)}
.card{border-radius:18px;padding:18px;border:1px solid var(--ln);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0}th{background:#f3f7ff;font-weight:700;color:#4b5b78;padding:9px 10px}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:10px;border-bottom:1px solid #edf2fb}tr:hover td{background:#f8faff}
input,select,textarea{border:1px solid #d3def2;border-radius:10px;padding:10px 12px;transition:.15s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 4px rgba(26,86,219,.15)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(26,86,219,.4);outline-offset:2px}
.btn{border-radius:10px;background:linear-gradient(180deg,#3374f2,#1a56db)}.btn.o{background:#fff}.btn.d{background:linear-gradient(180deg,#ef4538,#d92d20)}
.btn:hover:not(:disabled){filter:brightness(1.07);background:linear-gradient(180deg,#3374f2,#1a56db)}.btn.o:hover:not(:disabled){background:var(--bl)}.btn.d:hover:not(:disabled){background:linear-gradient(180deg,#ef4538,#d92d20)}.hero2 .btn,.hero2 .btn:hover:not(:disabled){background:#fff}.hero2 .btn:hover:not(:disabled){background:#eaf1ff}
.bg{padding:3px 10px;font-weight:600}.al{border-radius:12px;border-left:4px solid var(--b)}.al.warn{border-left-color:#f79009}.al.danger{border-left-color:#d92d20}

@media(max-width:800px){aside{position:static;height:auto;width:auto;flex-direction:row;overflow:visible}.brand,.uc{display:none}main{padding:12px}}

/* ===== v2 visual upgrade ===== */
body{background:radial-gradient(900px 500px at 90% -10%,#dbe8ff,transparent 60%),radial-gradient(700px 400px at -10% 110%,#e2ecff,transparent 60%),#f2f6fd}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes shift{0%,100%{background-position:0 0,0 0,0% 50%}50%{background-position:0 0,0 0,100% 50%}}
main>.card,main>.kpis,main>.g2,main>.g3,.kp6>*,.g2>.card{animation:up .5s ease backwards}.kp6>*:nth-child(2){animation-delay:.05s}.kp6>*:nth-child(3){animation-delay:.1s}.kp6>*:nth-child(4){animation-delay:.15s}.kp6>*:nth-child(5){animation-delay:.2s}.kp6>*:nth-child(6){animation-delay:.25s}.kp6>*:nth-child(7){animation-delay:.3s}

function openP(id){const p=P(id),r=cur.role;if(r=='management')return toast('Management sees summaries only. Individual clinical records are restricted.','err');if(!mine(p))return toast('This patient is outside your assigned wing.','err');const ts=S.temps.filter(t=>t.pid==id).slice(-8).reverse(),vs=S.visits.filter(v=>v.pid==id).slice(-4).reverse();

function record(){const a=act().filter(mine).sort((x,y)=>!!prim(x.id)-!!prim(y.id)),p=sel&&P(sel);
 const list=`<div><div class="card"><input placeholder="Search patient or room…" oninput="flt(this)"><small style="color:var(--g)">${cur.role=='nurse'?'Showing Wing '+cur.wing+' patients only':''}</small></div><div class="sc">${a.map(x=>`<div class="it ${sel==x.id?'on':''}" onclick="sel='${x.id}';render()"><span>Room ${x.room} · ${e(x.name)}</span>${tb(x)}</div>`).join('')}</div></div>`;

 if(isNaN(v)||v<34||v>42)return toast('Invalid temperature. Enter a value between 34.0 and 42.0 °C and re-measure if needed.','err');

function visits(){const a=act().sort((x,y)=>!!vis(x.id)-!!vis(y.id)||!!prim(y.id)-!!prim(x.id)),p=sel&&P(sel);
 const list=`<div><div class="card"><input placeholder="Search…" oninput="flt(this)"></div><div class="sc">${a.map(x=>`<div class="it ${sel==x.id?'on':''}" onclick="sel='${x.id}';render()"><span>R${x.room} · ${e(x.name)}</span><span>${tb(x)} ${vb(x)}</span></div>`).join('')}</div></div>`;

function discharge(){const a=act(),r=cur.role,el=a.filter(p=>elig(p)),ap=a.filter(p=>p.appr);

<div class="card"><h3>Developer constraints (Q3)</h3><ul><li>One primary temperature per patient per day; extra readings need a reason</li><li>Valid range 34.0–42.0 °C; fever threshold ≥ ${S.cfg.fever} °C</li><li>Missing reading is "pending", never fever-free</li><li>Doctor cannot complete a visit without temperature unless urgent</li><li>Admin can discharge only after doctor confirmation</li><li>Admissions blocked at 74 patients; one patient per room</li><li>Fever-free days count completed days only. Today's reading never completes the 3-day rule, and a fever today resets it</li><li>Doctor can confirm discharge only after that day's visit is completed</li><li>Nurses see only their assigned wing; management sees summaries only, with no identifiable clinical records</li><li>Records are never deleted; every action is logged</li><li>Mortality &gt; 15% raises an alert to management</li><li>10-minute inactivity auto sign-out</li></ul></div></div><div class="card"><h3>About this prototype</h3><p>A frontend-only functional prototype built with plain HTML, CSS and JavaScript. Patients, readings and visits are simulated sample data stored in this browser (local storage). Sign-in, passwords and SMS codes are simulated and are not production-grade security. A real build would add a backend API, a database, real authentication and SMS delivery.</p></div>`}
let chk=null;const FT=[['A','High',1],['B','High',3],['C','High',5],['D','Medium',2],['E','Medium',3],['F','Medium',1],['G','Low',.4],['H','Low',.5],['I','Low',.3],['J','Low',.1]],VL={High:6,Medium:3,Low:1};
function best(rem){let b=null;for(let m=0;m<1024;m++){let ef=0,v=0;FT.forEach((f,i)=>{if(m>>i&1){ef+=Math.round(f[2]*10);v+=VL[f[1]]}});if(ef<=rem*10&&(!b||v>b.v||v==b.v&&ef<b.ef))b={m,ef,v}}return FT.map((f,i)=>b.m>>i&1)}
function sprint(){const rem=25-15;if(!chk)chk=best(rem);let ef=0,v=0;FT.forEach((f,i)=>{if(chk[i]){ef+=f[2];v+=VL[f[1]]}});ef=+ef.toFixed(1);
 return`<div class="card"><h3>Capacity</h3><p>Velocity 25 − committed (3 × 5 = 15) = <b>${rem}</b> story points free. Values: High 6, Medium 3, Low 1 (High = 2× Medium, Medium = 3× Low).</p><div class="bar"><i style="width:${Math.min(100,ef/rem*100)}%;${ef>rem?'background:#d92d20':''}"></i></div><p>Selected effort <b>${ef}</b> / ${rem} · Total value <b>${v}</b> · Sprint total ${15+ef} / 25 ${ef>rem?'<span class="bg r">Over capacity</span>':'<span class="bg k">Fits</span>'}</p><button class="btn" onclick="chk=best(${rem});render()">Select optimal set</button></div>
<div class="card"><table><tr><th></th><th>Feature</th><th>Priority</th><th>Effort</th><th>Value</th></tr>${FT.map((f,i)=>`<tr><td><input type="checkbox" style="width:auto" ${chk[i]?'checked':''} onchange="chk[${i}]=this.checked?1:0;render()"></td><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${VL[f[1]]}</td></tr>`).join('')}</table><p>Optimal: <b>A, B, D, F, G, H, I, J</b>: effort 8.3, value 22. C and E cost 5 and 3 points for only 6 and 3 value, so they do not fit alongside this set.</p></div>`}
render();
